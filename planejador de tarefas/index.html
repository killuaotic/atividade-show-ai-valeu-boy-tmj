<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
    <div class="container">

        <h1 id="titulo">Meu Planejador de Tarefas</h1>

        <h2>Nova Tarefa</h2>

        <input type="text" id="nova-tarefa" placeholder="Digite a nova tarefa">

        <input type="text" id="materia" placeholder="Digite a matéria">

        <select id="prioridade">
            <option value="">Selecione a prioridade</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
        </select>

        <button onclick="adicionarTarefa()">
            Cadastrar Tarefa
        </button>

        <button onclick="limparCampos()">
            Limpar Campos
        </button>

        <p id="mensagem"></p>

        <div id="contadores">

            <p id="contador"> Tarefas cadastradas: 0</p>
            <p id="contadorConcluidas"> Tarefas concluídas: 0</p>
        </div>

        <button onclick="alternarModo()">Modo de concentração</button>

        <h2>Minhas tarefas</h2>

        <div id="lista-tarefas">
            
        </div>
    </div>

    <script src="script.js"></script>



</body>
</html>
